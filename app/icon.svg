<!--
  Tab / PWA icon. Serves /icon.svg; app/manifest.ts lists it as "any" and "maskable".

  The path is Phosphor's AirplaneTakeoff, regular weight, the same glyph SiteHeader
  renders. It replaced a hand-drawn plane, so the app no longer ships two different
  aircraft claiming to be one brand. The hand-drawn original also had a ground line,
  so takeoff is the reading this icon always had. viewBox 256 is Phosphor's own space,
  which is what lets the path be pasted rather than retraced; rx 48 of 256 is the
  18.75% corner the previous 32-unit tile had at rx 6.

  Polarity is the inverse of the header (light tile, dark glyph) on purpose. A favicon
  lands on browser chrome this app cannot measure, and a near-white tile loses its
  edge against a light tab strip. One glyph in two polarities is a lockup pair.

  Colours are the canvas and ink token values. The tile was #171717, which matched no
  token in the app: an orphan hex of the kind that survived the palette repaint in
  three other places, because a raw hex is invisible to a token sweep.

  THE TRANSFORM IS NOT A PLAIN CENTRED SCALE, and it cannot be. This glyph's ink runs
  x 8 to 248 and y 48 to 224, so it is 94% wide, 69% tall, and its centre sits 8 units
  BELOW the middle of the viewBox. Scaling about (128,128) would preserve that offset
  and leave the plane low in the tile. Scaling about the ink's own centre (128,136) and
  landing that point on (128,128) corrects it, which is what the two translates do.
  0.66 puts the ink at ~62% of the tile width, the padding a 16px favicon needs. Width
  is the constraint for this glyph, not height.

  NOTE FOR EDITORS: this is an XML comment, so a double hyphen is a parse error. Do
  not write CSS custom property names here. An earlier revision spelled out the canvas
  token, which killed the whole file: the icon rendered nothing while tsc, the build,
  the test suite and a curl status check all stayed green. lib/svgAssets.test.ts now
  parses every SVG in app/ and public/, so that cannot happen silently again.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect width="256" height="256" rx="48" fill="#0b0b0d" />
  <g transform="translate(128 128) scale(0.66) translate(-128 -136)" fill="#fafafa">
    <path d="M176,216a8,8,0,0,1-8,8H24a8,8,0,0,1,0-16H168A8,8,0,0,1,176,216ZM247.86,93.15a8,8,0,0,1-3.76,5.39l-147.41,88a40.18,40.18,0,0,1-20.26,5.52,39.78,39.78,0,0,1-27.28-10.87l-.12-.12L13,145.8a16,16,0,0,1,4.49-26.21l3-1.47a8,8,0,0,1,6.08-.4l28.26,9.54L75,115.06,53.17,93.87A16,16,0,0,1,57.7,67.4l.32-.13,7.15-2.71a8,8,0,0,1,5.59,0L124.7,84.38,176.27,53.6a39.82,39.82,0,0,1,51.28,9.12l.12.15,18.64,23.89A8,8,0,0,1,247.86,93.15Zm-19.74-3.7-13-16.67a23.88,23.88,0,0,0-30.68-5.42l-54.8,32.72a8.06,8.06,0,0,1-6.87.64L68,80.58l-4,1.53.21.2L93.57,110.8a8,8,0,0,1-1.43,12.58L59.93,142.87a8,8,0,0,1-6.7.73l-28.67-9.67-.19.1-.37.17a.71.71,0,0,1,.13.12l36,35.26a23.85,23.85,0,0,0,28.42,3.18Z" />
  </g>
</svg>
